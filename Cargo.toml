[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/parser",
    "crates/resolver",
    "crates/graph",
    "crates/rules",
    "crates/config",
    "crates/framework",
    "crates/discovery",
    "crates/lsp",
    "crates/mcp",
    "crates/engine",
    "crates/reporters",
    "crates/cli",
]

[workspace.package]
edition = "2024"
version = "0.0.17"
license = "MIT"

[workspace.dependencies]
ignore = "=0.4.23"
globset = "=0.4.15"
fs2 = "=0.4.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "=0.10.7"
tree-sitter = "=0.24.7"
tree-sitter-typescript = "=0.23.2"
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }
lsp-server = "=0.7.9"
url = "=2.5.4"
ctrlc = "=3.4.7"
