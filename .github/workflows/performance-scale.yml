name: Full-engine scale

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      WAE_ENGINE_LARGE_MODULES: "100000"
      WAE_ENGINE_LARGE_COLD_BUDGET_MS: "120000"
      WAE_ENGINE_LARGE_WARM_BUDGET_MS: "15000"
      WAE_ENGINE_LARGE_EDIT_BUDGET_MS: "15000"
      WAE_ENGINE_LARGE_SEMANTIC_EDIT_BUDGET_MS: "30000"
      WAE_ENGINE_LARGE_RSS_BUDGET_KB: "1572864"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run 100k full-engine cold, warm and edit gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/performance
          cargo test -p wae-engine --release --locked --test real_world_scale \
            large_full_engine_cold_warm_and_edit_are_bounded \
            -- --ignored --exact --nocapture 2>&1 | tee target/performance/engine-100k.txt
      - name: Record reproducible performance environment
        if: always()
        env:
          WAE_JOB_CONCLUSION: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path

          output = {
              "schemaVersion": 2,
              "commitSha": os.environ["GITHUB_SHA"],
              "runUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "jobName": "engine-100k",
              "conclusion": os.environ["WAE_JOB_CONCLUSION"],
              "runner": {
                  "os": platform.platform(),
                  "image": os.environ.get("ImageOS"),
                  "imageVersion": os.environ.get("ImageVersion"),
                  "cpu": platform.processor() or Path("/proc/cpuinfo").read_text().split("model name", 1)[-1].splitlines()[0].lstrip("\t: "),
              },
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True).strip(),
              "profiles": ["cold", "warm", "syntax-only", "edge-local", "global-cycle"],
              "sampleLogs": ["engine-100k.txt"],
          }
          Path("target/performance/metadata.json").write_text(json.dumps(output, indent=2) + "\n")
          PY
      - name: Retain 100k scale history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-100k-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/performance/
          if-no-files-found: error
