name: Publish npm Package

on:
  # Called by release-binaries.yml once the release assets are uploaded.
  # A `release: published` trigger cannot be used: the release is created by
  # the default GITHUB_TOKEN, and releases created that way do not trigger
  # other workflows, so publishing silently never ran.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (example: v0.1.0)"
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve tag and npm version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "A release tag is required"
            exit 1
          fi

          VERSION="${TAG#v}"
          if [ "$VERSION" = "$TAG" ] || [ -z "$VERSION" ]; then
            echo "Tag must follow v<semver> format"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set npm package version from tag
        working-directory: npm/wae
        run: npm version ${{ steps.meta.outputs.version }} --no-git-tag-version

      - name: Publish to npmjs.com
        working-directory: npm/wae
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
