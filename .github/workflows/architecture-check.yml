name: Architecture Check

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify a realistic Next.js consumer contract
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p wae-cli
          cd fixtures/consumer-next
          ../../target/debug/wae-cli config validate --show-overlaps
          ../../target/debug/wae-cli check --format json > wae-consumer-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("wae-consumer-result.json").read_text())
          assert result["failureCount"] == 0, result
          assert result["sourceModules"] == 13, result
          assert result["dependencies"] == 7, result
          PY
          rm wae-consumer-result.json

      - name: Run changed-file architecture analysis
        id: check
        continue-on-error: true
        env:
          WAE_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          set +e
          cargo run -p wae-cli -- check --changed --format json > wae-result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path("wae-result.json")
          result = json.loads(result_path.read_text()) if result_path.exists() and result_path.stat().st_size else {"modules": 0, "diagnostics": []}
          baseline = json.loads(Path(".wae/baseline.json").read_text())
          diagnostics = result.get("diagnostics", [])
          failure_count = result.get("failureCount", 0)
          regression = result.get("regression", {})
          lines = [
              "### WAE Architecture Check", "",
              f"Modules analyzed: {result.get('modules', 0)}",
              f"Baseline violations: {len(baseline.get('entries', baseline.get('fingerprints', [])))}",
              f"Diagnostics reported: {len(diagnostics)}",
              f"New affected fail-level violations: {failure_count}", "",
              f"Existing affected: {regression.get('existing', 0)}",
              f"Fixed baseline violations: {regression.get('fixed', 0)}", "",
              "✅ No architecture regression." if failure_count == 0 else "❌ Architecture regression detected.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Generate SARIF annotations
        if: always()
        env:
          WAE_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: cargo run -p wae-cli -- check --changed --format sarif > wae-result.sarif || test "$?" = "1"

      - name: Upload SARIF annotations
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: wae-result.sarif

      - name: Fail on violations or tool errors
        if: always()
        run: test "${{ steps.check.outputs.exit_code }}" = "0"
