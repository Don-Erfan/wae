name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (example: v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify signed release tag
        shell: bash
        run: |
          set -euo pipefail
          ref="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          tag_url=$(curl --fail --silent --show-error --location "$ref" | jq -r '.object | select(.type == "tag") | .url')
          test -n "$tag_url"
          test "$(curl --fail --silent --show-error --location "$tag_url" | jq -r '.verification.verified')" = "true"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo audit --deny warnings
      - working-directory: npm/wae
        run: npm run test:installer
      - working-directory: npm/wae
        env:
          WAE_SKIP_DOWNLOAD: "1"
        run: npm pack --dry-run

  test-matrix:
    name: Test ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, test-matrix]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wae-x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: wae-aarch64-unknown-linux-gnu
            exe_suffix: ""
          # Tree-sitter compiles native C code, so each Apple architecture uses
          # a native runner instead of relying on a partial cross toolchain.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: wae-x86_64-apple-darwin
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wae-aarch64-apple-darwin
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wae-x86_64-pc-windows-msvc.exe
            exe_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release -p wae-cli --target ${{ matrix.target }}

      - name: Collect binary asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          src=""
          for candidate in wae wae-cli wae_cli; do
            path="target/${{ matrix.target }}/release/${candidate}${{ matrix.exe_suffix }}"
            if [ -f "$path" ]; then
              src="$path"
              break
            fi
          done

          if [ -z "$src" ]; then
            echo "Could not locate built binary in target/${{ matrix.target }}/release"
            ls -la "target/${{ matrix.target }}/release"
            exit 1
          fi

          cp "$src" "dist/${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          fi

      - name: Upload binary asset artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: Upload binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true

      - name: Verify and aggregate binary checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate SPDX SBOM for release assets
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: wae-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Move SBOM into release assets
        shell: bash
        run: |
          set -euo pipefail
          mv "wae-${RELEASE_TAG}.spdx.json" dist/
          cd dist
          sha256sum "wae-${RELEASE_TAG}.spdx.json" >> SHA256SUMS
          LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign aggregate checksum manifest with keyless Sigstore
        shell: bash
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Extract curated release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          NPM_VERSION=$(node -p "require('./npm/wae/package.json').version")
          test -n "$VERSION"
          test "$VERSION" != "$RELEASE_TAG"
          test "$CARGO_VERSION" = "$VERSION"
          test "$NPM_VERSION" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm package contents
        working-directory: npm/wae
        env:
          WAE_SKIP_DOWNLOAD: "1"
        run: npm pack --dry-run

      - name: Publish to npmjs.com
        working-directory: npm/wae
        run: npm publish --access public
