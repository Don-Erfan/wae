name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (example: v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Verify signed release tag
        shell: bash
        run: |
          set -euo pipefail
          ref="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          tag_url=$(curl --fail --silent --show-error --location "$ref" | jq -r '.object | select(.type == "tag") | .url')
          test -n "$tag_url"
          test "$(curl --fail --silent --show-error --location "$tag_url" | jq -r '.verification.verified')" = "true"
  readiness:
    name: Complete v1 readiness gate
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  build:
    name: Build ${{ matrix.target }}
    needs: [verify, readiness]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wae-x86_64-unknown-linux-gnu
            exe_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: wae-aarch64-unknown-linux-gnu
            exe_suffix: ""
          # Tree-sitter compiles native C code, so each Apple architecture uses
          # a native runner instead of relying on a partial cross toolchain.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: wae-x86_64-apple-darwin
            exe_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wae-aarch64-apple-darwin
            exe_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wae-x86_64-pc-windows-msvc.exe
            exe_suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --release -p wae-cli -p wae-lsp -p wae-mcp --target ${{ matrix.target }}

      - name: Collect binary asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          src=""
          for candidate in wae wae-cli wae_cli; do
            path="target/${{ matrix.target }}/release/${candidate}${{ matrix.exe_suffix }}"
            if [ -f "$path" ]; then
              src="$path"
              break
            fi
          done

          if [ -z "$src" ]; then
            echo "Could not locate built binary in target/${{ matrix.target }}/release"
            ls -la "target/${{ matrix.target }}/release"
            exit 1
          fi

          cp "$src" "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/wae-lsp${{ matrix.exe_suffix }}" \
            "dist/wae-lsp-${{ matrix.target }}${{ matrix.exe_suffix }}"
          cp "target/${{ matrix.target }}/release/wae-mcp${{ matrix.exe_suffix }}" \
            "dist/wae-mcp-${{ matrix.target }}${{ matrix.exe_suffix }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && for asset in wae*; do sha256sum "$asset" > "$asset.sha256"; done)
          else
            (cd dist && for asset in wae*; do shasum -a 256 "$asset" > "$asset.sha256"; done)
          fi

      - name: Upload binary asset artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: Upload binaries to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wae-*
          path: dist
          merge-multiple: true

      - name: Download verified editor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ide-clients
          path: dist

      - name: Verify and aggregate binary checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          find . -type f \( -name '*.vsix' -o -name '*.zip' \) -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 -r sha256sum >> SHA256SUMS
          LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS

      - name: Generate SPDX inventory for release assets
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: wae-${{ env.RELEASE_TAG }}-assets.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate CycloneDX dependency SBOM from Cargo.lock
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: wae-${{ env.RELEASE_TAG }}-dependencies.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Move SBOM into release assets
        shell: bash
        run: |
          set -euo pipefail
          mv "wae-${RELEASE_TAG}-assets.spdx.json" dist/
          mv "wae-${RELEASE_TAG}-dependencies.cdx.json" dist/
          cd dist
          sha256sum "wae-${RELEASE_TAG}-assets.spdx.json" >> SHA256SUMS
          sha256sum "wae-${RELEASE_TAG}-dependencies.cdx.json" >> SHA256SUMS
          LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign aggregate checksum manifest with keyless Sigstore
        shell: bash
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Extract curated release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          NPM_VERSION=$(node -p "require('./npm/wae/package.json').version")
          test -n "$VERSION"
          test "$VERSION" != "$RELEASE_TAG"
          test "$CARGO_VERSION" = "$VERSION"
          test "$NPM_VERSION" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm package contents
        working-directory: npm/wae
        env:
          WAE_SKIP_DOWNLOAD: "1"
        run: npm pack --dry-run

      - name: Publish to npmjs.com
        working-directory: npm/wae
        run: npm publish --access public
