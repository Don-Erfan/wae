name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85.0"]
        exclude:
          - os: macos-latest
            rust: "1.85.0"
          - os: windows-latest
            rust: "1.85.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  tests:
    runs-on: ubuntu-latest
    if: always()
    needs: test-matrix
    steps:
      - name: Require every test matrix entry to pass
        env:
          TEST_MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$TEST_MATRIX_RESULT" = "success"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --deny warnings

  performance:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      WAE_GRAPH_BUDGET_MS: "15000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile every benchmark target
        run: cargo bench --workspace --no-run --locked
      - name: Enforce 100k graph time and memory budgets
        run: cargo test -p wae-graph --release --locked tests::graph_100k_performance_gate -- --ignored --exact
      - name: Run 500-module cold, warm and fault-injection acceptance
        run: cargo test -p wae-engine --release --locked --test real_world_scale five_hundred_module_next_project_supports_warm_analysis_and_fault_injection -- --ignored --exact

  npm-installer:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - working-directory: npm/wae
        run: npm run test:installer
      - working-directory: npm/wae
        env:
          WAE_SKIP_DOWNLOAD: "1"
        run: npm pack --dry-run

  ide-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p wae-lsp --locked
      - working-directory: editors/vscode
        run: npm ci && npm run check
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          gradle-version: "8.10.2"
      - name: Compile, package and verify the JetBrains plugin
        working-directory: editors/jetbrains
        run: gradle --no-daemon buildPlugin verifyPlugin

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-fuzz@0.13.1
          fallback: none
      - run: cargo fuzz run parser_imports -- -max_total_time=10
      - run: cargo fuzz run config_yaml -- -max_total_time=10

  integration-contracts:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify MCP initialize and tool discovery
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | cargo run --quiet -p wae-mcp > target/mcp-contract.jsonl
          test "$(sed -n '1p' target/mcp-contract.jsonl | jq -r '.result.protocolVersion')" = "2025-06-18"
          test "$(sed -n '2p' target/mcp-contract.jsonl | jq '.result.tools | length')" = "4"
      - name: Verify self-contained Architecture Explorer
        run: |
          cargo run --quiet -p wae-cli -- explore --output target/architecture-explorer.html
          grep -q 'WAE Architecture Explorer' target/architecture-explorer.html
          grep -q 'application/json' target/architecture-explorer.html
      - name: Validate npm sidecar installer contract
        working-directory: npm/wae
        run: npm run test:installer

  v1-readiness:
    name: v1 readiness
    if: always()
    needs:
      - quality
      - tests
      - audit
      - performance
      - npm-installer
      - ide-clients
      - fuzz-smoke
      - integration-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          NPM_INSTALLER: ${{ needs.npm-installer.result }}
          IDE_CLIENTS: ${{ needs.ide-clients.result }}
          FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          INTEGRATION_CONTRACTS: ${{ needs.integration-contracts.result }}
        run: |
          for result in "$QUALITY" "$TESTS" "$AUDIT" "$PERFORMANCE" \
            "$NPM_INSTALLER" "$IDE_CLIENTS" "$FUZZ_SMOKE" "$INTEGRATION_CONTRACTS"; do
            test "$result" = "success"
          done
