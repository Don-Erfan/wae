name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to verify.
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAE_CHECKOUT_REF: ${{ inputs.ref || github.sha }}

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.85.0"]
        exclude:
          - os: macos-latest
            rust: "1.85.0"
          - os: windows-latest
            rust: "1.85.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked

  tests:
    runs-on: ubuntu-latest
    if: always()
    needs: test-matrix
    steps:
      - name: Require every test matrix entry to pass
        env:
          TEST_MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$TEST_MATRIX_RESULT" = "success"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --deny warnings

  performance:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      WAE_GRAPH_BUDGET_MS: "15000"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compile every benchmark target
        run: cargo bench --workspace --no-run --locked
      - name: Enforce 100k graph time and memory budgets
        run: cargo test -p wae-graph --release --locked tests::graph_100k_performance_gate -- --ignored --exact
      - name: Run 500-module cold, warm and fault-injection acceptance
        run: cargo test -p wae-engine --release --locked --test real_world_scale five_hundred_module_next_project_supports_warm_analysis_and_fault_injection -- --ignored --exact
      - name: Enforce 10k Universal all-rules cold-path budget
        env:
          WAE_ENGINE_10K_BUDGET_MS: "3000"
          WAE_ENGINE_10K_WARM_BUDGET_MS: "650"
          WAE_ENGINE_10K_EDIT_BUDGET_MS: "750"
          WAE_ENGINE_10K_RSS_BUDGET_KB: "262144"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/performance
          cargo test -p wae-engine --release --locked --test real_world_scale \
            ten_thousand_universal_modules_keep_cold_analysis_near_linear \
            -- --ignored --exact --nocapture 2>&1 | tee target/performance/engine-10k.txt
      - name: Enforce 50k full-engine cold, warm and edit budgets
        env:
          WAE_ENGINE_LARGE_MODULES: "50000"
          WAE_ENGINE_LARGE_COLD_BUDGET_MS: "30000"
          WAE_ENGINE_LARGE_WARM_BUDGET_MS: "5000"
          WAE_ENGINE_LARGE_EDIT_BUDGET_MS: "5000"
          WAE_ENGINE_LARGE_RSS_BUDGET_KB: "786432"
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p wae-engine --release --locked --test real_world_scale \
            large_full_engine_cold_warm_and_edit_are_bounded \
            -- --ignored --exact --nocapture 2>&1 | tee target/performance/engine-50k.txt
      - name: Retain performance timing and peak-RSS history
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/performance/engine-*.txt
          if-no-files-found: error

  npm-installer:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - working-directory: npm/wae
        run: npm run test:installer
      - working-directory: npm/wae
        env:
          WAE_SKIP_DOWNLOAD: "1"
        run: npm pack --dry-run

  ide-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test -p wae-lsp --locked
      - working-directory: editors/vscode
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run check
          npm run compile
          WAE_LSP_PATH="$GITHUB_WORKSPACE/target/debug/wae-lsp" xvfb-run -a npm run test:e2e
          npx --yes @vscode/vsce@3.6.0 package --out ../../target/wae-vscode.vsix
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@16f3e46a58d2b926c34615132d7969a96bccb22b # v6.0.0
        with:
          gradle-version: "8.10.2"
      - name: Compile, package and verify the JetBrains plugin
        working-directory: editors/jetbrains
        run: gradle --no-daemon buildPlugin verifyPlugin
      - name: Collect installable editor packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ide-dist
          cp target/wae-vscode.vsix target/ide-dist/
          jetbrains_package=$(find editors/jetbrains/build/distributions -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$jetbrains_package"
          cp "$jetbrains_package" target/ide-dist/wae-jetbrains.zip
      - name: Retain installable editor artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ide-clients
          path: target/ide-dist/*
          if-no-files-found: error

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1
      - run: cargo fuzz run parser_imports -- -max_total_time=10
      - run: cargo fuzz run config_yaml -- -max_total_time=10

  integration-contracts:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.WAE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify MCP initialize and tool discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | cargo run --quiet -p wae-mcp > target/mcp-contract.jsonl
          test "$(sed -n '1p' target/mcp-contract.jsonl | jq -r '.result.protocolVersion')" = "2025-06-18"
          test "$(sed -n '2p' target/mcp-contract.jsonl | jq '.result.tools | length')" = "5"
      - name: Verify self-contained Architecture Explorer
        run: |
          cargo run --quiet -p wae-cli -- explore --output target/architecture-explorer.html
          grep -q 'WAE Architecture Explorer' target/architecture-explorer.html
          grep -q 'application/json' target/architecture-explorer.html
      - name: Audit a pinned real-world Next.js consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/vercel-commerce"
          git init "$consumer"
          git -C "$consumer" remote add origin https://github.com/vercel/commerce.git
          git -C "$consumer" fetch --depth=1 origin 3761e52e60df9c6a316e067dbfd7032e494d3634
          git -C "$consumer" checkout --detach FETCH_HEAD
          set +e
          (cd "$consumer" && "$GITHUB_WORKSPACE/target/debug/wae-cli" check --no-cache --format json) \
            > target/vercel-commerce-audit.json
          status=$?
          set -e
          test "$status" = 1
          test "$(jq -r '.sourceModules' target/vercel-commerce-audit.json)" = 66
          test "$(jq -r '.dependencies' target/vercel-commerce-audit.json)" = 210
          test "$(jq -r '.failureCount' target/vercel-commerce-audit.json)" = 1
          jq -e '
            .diagnostics | length == 1 and
            .[0].rule_id == "ARCH-001" and
            .[0].fingerprint == "734895f168870444" and
            .[0].dependency_path == [
              "components/layout/search/filter/index.tsx",
              "components/layout/search/filter/dropdown.tsx",
              "components/layout/search/filter/index.tsx"
            ]
          ' target/vercel-commerce-audit.json
      - name: Validate npm sidecar installer contract
        working-directory: npm/wae
        run: npm run test:installer

  v1-readiness:
    name: v1 readiness
    if: always()
    needs:
      - quality
      - tests
      - audit
      - performance
      - npm-installer
      - ide-clients
      - fuzz-smoke
      - integration-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.audit.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          NPM_INSTALLER: ${{ needs.npm-installer.result }}
          IDE_CLIENTS: ${{ needs.ide-clients.result }}
          FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          INTEGRATION_CONTRACTS: ${{ needs.integration-contracts.result }}
        run: |
          for result in "$QUALITY" "$TESTS" "$AUDIT" "$PERFORMANCE" \
            "$NPM_INSTALLER" "$IDE_CLIENTS" "$FUZZ_SMOKE" "$INTEGRATION_CONTRACTS"; do
            test "$result" = "success"
          done
