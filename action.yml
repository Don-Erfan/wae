name: Web Architecture Engine
description: Run deterministic WAE architecture checks in a JavaScript/TypeScript repository.
author: Don Erfan
branding:
  icon: share-2
  color: green
inputs:
  version:
    description: Exact @don-erfan/wae version to install.
    required: false
    default: "1.0.0"
  working-directory:
    description: Directory containing wae.yaml (the project root to analyze).
    required: false
    default: "."
  changed:
    description: Check only new fail-level violations in the Git affected closure (requires a committed baseline).
    required: false
    default: "false"
  base:
    description: Explicit Git base ref used when changed is true.
    required: false
    default: ""
  format:
    description: Console reporter format (human, json, jsonl or sarif).
    required: false
    default: human
  config:
    description: Optional path to wae.yaml, relative to working-directory.
    required: false
    default: ""
  annotations:
    description: Add inline pull-request annotations for every active diagnostic.
    required: false
    default: "true"
  summary:
    description: Write an architecture summary (counts, regression, dependency paths) to the job summary.
    required: false
    default: "true"
  upload-sarif:
    description: Also upload SARIF to GitHub code scanning (needs security-events write and code scanning enabled).
    required: false
    default: "false"
  sarif-file:
    description: Path used for the generated SARIF report.
    required: false
    default: "wae-results.sarif"
outputs:
  exit-code:
    description: WAE exit code (0 passed, 1 violations, 2 config/project error, 3 internal error).
    value: ${{ steps.wae-check.outputs.status }}
  failure-count:
    description: Number of fail-level diagnostics.
    value: ${{ steps.wae-report.outputs.failure-count }}
  warning-count:
    description: Number of warning diagnostics.
    value: ${{ steps.wae-report.outputs.warning-count }}
  report-file:
    description: Path to the JSON report.
    value: ${{ steps.wae-check.outputs.report }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Run WAE architecture check
      id: wae-check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WAE_ACTION_VERSION: ${{ inputs.version }}
        WAE_ACTION_CHANGED: ${{ inputs.changed }}
        WAE_ACTION_BASE: ${{ inputs.base }}
        WAE_ACTION_FORMAT: ${{ inputs.format }}
        WAE_ACTION_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        echo "WAE GitHub Action resolved engine version: $WAE_ACTION_VERSION"
        case "$WAE_ACTION_VERSION" in
          *[!0-9A-Za-z._-]*) echo "Invalid WAE version" >&2; exit 2 ;;
        esac
        case "$WAE_ACTION_FORMAT" in
          human|json|jsonl|sarif) ;;
          *) echo "Invalid WAE output format" >&2; exit 2 ;;
        esac
        case "$WAE_ACTION_CHANGED" in
          true|false) ;;
          *) echo "changed must be true or false" >&2; exit 2 ;;
        esac
        args=(check)
        if [ "$WAE_ACTION_CHANGED" = "true" ]; then args+=(--changed); fi
        if [ -n "$WAE_ACTION_BASE" ]; then args+=(--base "$WAE_ACTION_BASE"); fi
        if [ -n "$WAE_ACTION_CONFIG" ]; then args+=(--config "$WAE_ACTION_CONFIG"); fi
        wae() { npm exec --yes --package "@don-erfan/wae@$WAE_ACTION_VERSION" -- wae "$@"; }
        report="$RUNNER_TEMP/wae-results.json"
        set +e
        # One machine-readable analysis drives annotations, the summary and the exit status.
        wae "${args[@]}" --format json > "$report"
        status=$?
        if [ "$WAE_ACTION_FORMAT" = "json" ]; then
          cat "$report"
        elif [ "$status" -le 1 ]; then
          # The incremental cache makes this console rendering cheap.
          wae "${args[@]}" --format "$WAE_ACTION_FORMAT"
        fi
        set -e
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
    - name: Annotate pull request and write job summary
      id: wae-report
      if: always() && steps.wae-check.outputs.report != ''
      shell: bash
      env:
        WAE_ACTION_ANNOTATIONS: ${{ inputs.annotations }}
        WAE_ACTION_SUMMARY: ${{ inputs.summary }}
        WAE_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        WAE_REPORT: ${{ steps.wae-check.outputs.report }}
        WAE_STATUS: ${{ steps.wae-check.outputs.status }}
      run: |
        set -euo pipefail
        prefix="${WAE_ACTION_WORKING_DIRECTORY#./}"
        prefix="${prefix%/}"
        if [ -n "$prefix" ] && [ "$prefix" != "." ]; then export WAE_ACTION_PATH_PREFIX="$prefix/"; fi
        node "$GITHUB_ACTION_PATH/action/report.js" "$WAE_REPORT" "$WAE_STATUS"
    - name: Generate SARIF report
      if: inputs.upload-sarif == 'true' && (steps.wae-check.outputs.status == '0' || steps.wae-check.outputs.status == '1')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WAE_ACTION_VERSION: ${{ inputs.version }}
        WAE_ACTION_CHANGED: ${{ inputs.changed }}
        WAE_ACTION_BASE: ${{ inputs.base }}
        WAE_ACTION_CONFIG: ${{ inputs.config }}
        WAE_ACTION_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -uo pipefail
        args=(check --format sarif)
        if [ "$WAE_ACTION_CHANGED" = "true" ]; then args+=(--changed); fi
        if [ -n "$WAE_ACTION_BASE" ]; then args+=(--base "$WAE_ACTION_BASE"); fi
        if [ -n "$WAE_ACTION_CONFIG" ]; then args+=(--config "$WAE_ACTION_CONFIG"); fi
        npm exec --yes --package "@don-erfan/wae@$WAE_ACTION_VERSION" -- wae "${args[@]}" > "$WAE_ACTION_SARIF_FILE"
        status=$?
        if [ "$status" -gt 1 ]; then exit "$status"; fi
        test -s "$WAE_ACTION_SARIF_FILE"
    - name: Upload WAE SARIF
      if: inputs.upload-sarif == 'true' && (steps.wae-check.outputs.status == '0' || steps.wae-check.outputs.status == '1')
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        category: wae-architecture
    - name: Propagate WAE exit status
      shell: bash
      env:
        WAE_STATUS: ${{ steps.wae-check.outputs.status }}
      run: exit "$WAE_STATUS"
